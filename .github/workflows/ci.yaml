name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [throws, throws_plugin, throws_collector]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib
      # example/ intentionally contains code the plugin should flag.
      - run: dart analyze lib
      - if: hashFiles(format('packages/{0}/test/**', matrix.package)) != ''
        run: dart analyze test && dart test
